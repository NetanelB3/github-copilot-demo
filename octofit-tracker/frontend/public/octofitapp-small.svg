<svg xmlns="http://www.w3.org/2000/svg" width="200" height="64" viewBox="0 0 200 64" role="img" aria-label="SepioFit">
  <defs>
    <linearGradient id="duckGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f80ed" />
      <stop offset="1" stop-color="#05b3c6" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#051937" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#soft)">
    <rect x="0" y="0" width="200" height="64" rx="20" fill="rgba(255,255,255,0.0)" />

    <!-- Cute rubber duck mark -->
    <g transform="translate(10 10)">
      <!-- badge -->
      <rect x="0" y="0" width="44" height="44" rx="16" fill="url(#duckGradient)" />

      <!-- duck body -->
      <path d="M10 27c0-6 6-11 14-11 6 0 10 2 12 6 5 0 8 3 8 7 0 6-7 10-17 10-10 0-17-5-17-12z" fill="#ffdf5d" opacity="0.98" />

      <!-- duck head -->
      <circle cx="20" cy="20" r="7" fill="#ffdf5d" />
      <circle cx="18" cy="19" r="1.6" fill="#051937" opacity="0.85" />

      <!-- beak -->
      <path d="M24 22c3 0 6 1 6 3s-3 3-6 3c-1 0-2 0-3-1 1-1 1-2 1-3s0-2-1-3c1-1 2-2 3-2z" fill="#ff8a3d" opacity="0.95" />

      <!-- sparkle -->
      <path d="M34 10l1.2 3.2 3.4 1.2-3.4 1.2-1.2 3.2-1.2-3.2-3.4-1.2 3.4-1.2z" fill="#ffffff" opacity="0.85" />
    </g>

    <!-- Wordmark -->
    <g transform="translate(64 22)">
      <text x="0" y="16" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="800" fill="#051937" letter-spacing="0.5">
        SepioFit
      </text>
    </g>
  </g>
</svg>
